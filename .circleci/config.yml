version: 2.1

executors:
  bun-executor:
    docker:
      - image: oven/bun:1
    working_directory: ~/project

commands:
  halt-stale-pipeline:
    description: Stop this job when a newer commit exists on the same branch.
    steps:
      - run:
          name: Halt Stale Pipeline
          command: |
            if [ -z "${CIRCLE_BRANCH:-}" ] || [ -z "${CIRCLE_SHA1:-}" ]; then
              exit 0
            fi

            latest_sha="$(git ls-remote origin "refs/heads/${CIRCLE_BRANCH}" | cut -f1)"

            if [ -z "$latest_sha" ] || [ "$latest_sha" = "$CIRCLE_SHA1" ]; then
              exit 0
            fi

            echo "Skipping stale pipeline for $CIRCLE_SHA1; latest $CIRCLE_BRANCH commit is $latest_sha."
            circleci-agent step halt

  install-node-toolchain:
    description: Install Node.js toolchain into workspace.
    steps:
      - run:
          name: Install Node Toolchain
          command: |
            NODE_VERSION="22.11.0"
            apt-get update && apt-get install -y --no-install-recommends ca-certificates curl git xz-utils
            mkdir -p "$HOME/project/.tools"
            curl -fsSL "https://nodejs.org/dist/v${NODE_VERSION}/node-v${NODE_VERSION}-linux-x64.tar.xz" -o /tmp/node.tar.xz
            tar -xJf /tmp/node.tar.xz -C "$HOME/project/.tools"
            mv "$HOME/project/.tools/node-v${NODE_VERSION}-linux-x64" "$HOME/project/.tools/node"
            update-ca-certificates
            "$HOME/project/.tools/node/bin/node" --version
            "$HOME/project/.tools/node/bin/npm" --version
            "$HOME/project/.tools/node/bin/npx" --version

  load-node-toolchain:
    description: Load Node toolchain and bun alias.
    steps:
      - run:
          name: Load Node from Workspace
          # alias npm to bun & bun to bunbun - current bun fails ox & wrangler
          command: |
            echo 'export PATH="$HOME/project/.tools/node/bin:$PATH"' >> "$BASH_ENV"
            echo "shopt -s expand_aliases" >> "$BASH_ENV"
            echo "alias bun='npm'" >> "$BASH_ENV"
            echo "alias bunbun='/usr/local/bin/bun'" >> "$BASH_ENV"
            source "$BASH_ENV"

jobs:
  qa:
    executor: bun-executor
    steps:
      - checkout
      - install-node-toolchain
      - halt-stale-pipeline
      - load-node-toolchain
      - restore_cache:
          keys:
            - bun-deps-{{ checksum "bun.lock" }}
      - run:
          name: Install Dependencies
          command: bunbun ci
      - save_cache:
          paths:
            - ~/.bun
          key: bun-deps-{{ checksum "bun.lock" }}
      - run:
          name: Run Check (lint | format)
          command: bun run check
      - run:
          name: Validate Recipes
          command: bun run validate
      - run:
          name: Run Tests
          command: bun test

  build:
    executor: bun-executor
    steps:
      - checkout
      - install-node-toolchain
      - halt-stale-pipeline
      - load-node-toolchain
      - restore_cache:
          keys:
            - bun-deps-{{ checksum "bun.lock" }}
      - run:
          name: Install Dependencies
          command: bunbun ci
      - run:
          name: Build Site
          command: bun run build
      - persist_to_workspace:
          root: ~/project
          paths:
            - build

  deploy:
    executor: bun-executor
    steps:
      - checkout
      - attach_workspace:
          at: ~/project
      - install-node-toolchain
      - halt-stale-pipeline
      - load-node-toolchain
      - restore_cache:
          keys:
            - bun-deps-{{ checksum "bun.lock" }}
      - run:
          name: Install Dependencies
          command: bunbun ci
      - run:
          name: Install rclone
          command: |
            apt-get update && apt-get install -y --no-install-recommends ca-certificates rclone
            rclone version
      - run:
          name: Deploy to Cloudflare Pages
          command: |
            test -n "$CLOUDFLARE_API_TOKEN" || (echo "Missing CLOUDFLARE_API_TOKEN" && exit 1)
            test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo "Missing CLOUDFLARE_ACCOUNT_ID" && exit 1)
            ls -la build
            bunbun src/cloudflare/upload-imgs-to-r2.ts && bun run deploy:site && bunbun src/cloudflare/delete-oldest-deployment.ts

workflows:
  version: 2
  validate-and-generate:
    jobs:
      - qa
      - build:
          requires:
            - qa
      - deploy:
          requires:
            - build
          filters:
            branches:
              only: main
