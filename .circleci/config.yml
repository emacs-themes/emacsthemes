version: 2.1

executors:
  bun-executor:
    docker:
      - image: oven/bun:1

jobs:
  lint:
    executor: bun-executor
    steps:
      - checkout
      - restore_cache:
          keys:
            - bun-deps-{{ checksum "bun.lock" }}
      - run:
          name: Install Dependencies
          command: bun ci
      - save_cache:
          paths:
            - node_modules
            - ~/.bun
          key: bun-deps-{{ checksum "bun.lock" }}
      - run:
          name: Run Linting
          command: bun run lint

  validate-recipes:
    executor: bun-executor
    steps:
      - run:
          name: Install Git
          command: apt-get update && apt-get install -y git
      - checkout
      - restore_cache:
          keys:
            - bun-deps-{{ checksum "bun.lock" }}
      - run:
          name: Install Dependencies
          command: bun install
      - save_cache:
          paths:
            - node_modules
            - ~/.bun
          key: bun-deps-{{ checksum "bun.lock" }}
      - run:
          name: Fetch Main Branch
          command: git fetch --depth=1 origin main || true
      - run:
          name: Validate Changed Recipes
          command: bun src/core/validate-pr.ts

workflows:
  version: 2
  validate-and-generate:
    jobs:
      - lint:
          filters:
            branches:
              ignore: main
      - validate-recipes:
          requires:
            - lint
          filters:
            branches:
              ignore: main
