version: 2.1

executors:
  bun-executor:
    docker:
      - image: oven/bun:1

jobs:
  lint:
    executor: bun-executor
    steps:
      - checkout
      - restore_cache:
          keys:
            - bun-deps-{{ checksum "bun.lock" }}
      - run:
          name: Install Dependencies
          command: bun install
      - save_cache:
          paths:
            - node_modules
            - ~/.bun
          key: bun-deps-{{ checksum "bun.lock" }}
      - run:
          name: Run Linting
          command: bun run lint

  validate-recipes:
    executor: bun-executor
    steps:
      - run:
          name: Install Git
          command: apt-get update && apt-get install -y git
      - checkout
      - restore_cache:
          keys:
            - bun-deps-{{ checksum "bun.lock" }}
      - run:
          name: Install Dependencies
          command: bun install
      - save_cache:
          paths:
            - node_modules
            - ~/.bun
          key: bun-deps-{{ checksum "bun.lock" }}
      - run:
          name: Fetch Main Branch
          command: git fetch --depth=1 origin main || true
      - run:
          name: Validate Changed Recipes
          command: bun src/validate-pr.ts

  generate-screenshots:
    docker:
      - image: debian:bookworm-slim
    steps:
      - checkout
      - run:
          name: Install System Dependencies
          command: |
            apt-get update
            apt-get install -y curl unzip xvfb imagemagick fonts-dejavu-core git emacs
      - run:
          name: Install Bun
          command: |
            curl -fsSL https://bun.sh/install | bash
            echo 'export PATH="$HOME/.bun/bin:$PATH"' >> $BASH_ENV
      - run:
          name: Install Project Deps
          command: bun install
      - run:
          name: Generate Screenshots
          command: bun src/generate-screenshots.ts
      - run:
          name: Commit and Push
          command: |
            if [ -n "$(git status --porcelain static/imgs/)" ]; then
              git config user.email "ci-bot@emacsthemes.com"
              git config user.name "CI Bot"
              git add static/imgs/
              git commit -m "[ci] auto-generate screenshots [skip ci]"
              git push origin main
            else
              echo "No changes to commit."
            fi

workflows:
  version: 2
  validate-and-generate:
    jobs:
      - lint
      - validate-recipes:
          requires:
            - lint
      - generate-screenshots:
          requires:
            - validate-recipes
          filters:
            branches:
              only: main
