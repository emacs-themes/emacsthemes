version: 2.1

executors:
  bun-executor:
    docker:
      - image: oven/bun:1
    working_directory: ~/project

commands:
  install-node-toolchain:
    description: Install Node.js toolchain into workspace.
    steps:
      - run:
          name: Install Node Toolchain
          command: |
            NODE_VERSION="22.11.0"
            apt-get update && apt-get install -y --no-install-recommends ca-certificates curl xz-utils
            mkdir -p "$HOME/project/.tools"
            curl -fsSL "https://nodejs.org/dist/v${NODE_VERSION}/node-v${NODE_VERSION}-linux-x64.tar.xz" -o /tmp/node.tar.xz
            tar -xJf /tmp/node.tar.xz -C "$HOME/project/.tools"
            mv "$HOME/project/.tools/node-v${NODE_VERSION}-linux-x64" "$HOME/project/.tools/node"
            update-ca-certificates
            "$HOME/project/.tools/node/bin/node" --version
            "$HOME/project/.tools/node/bin/npm" --version
            "$HOME/project/.tools/node/bin/npx" --version

  load-node-from-workspace:
    description: Load Node toolchain and bun alias from workspace.
    steps:
      - run:
          name: Load Node from Workspace
          # alias npm to bun & bun to bunbun - current bun fails ox & wrangler
          command: |
            echo 'export PATH="$HOME/project/.tools/node/bin:$PATH"' >> "$BASH_ENV"
            echo "shopt -s expand_aliases" >> "$BASH_ENV"
            echo "alias bun='npm'" >> "$BASH_ENV"
            echo "alias bunbun='/usr/local/bin/bun'" >> "$BASH_ENV"
            source "$BASH_ENV"

jobs:
  setup:
    executor: bun-executor
    steps:
      - checkout
      - install-node-toolchain
      - restore_cache:
          keys:
            - bun-deps-{{ checksum "bun.lock" }}
      - run:
          name: Install Dependencies
          command: bun ci
      - save_cache:
          paths:
            - ~/.bun
          key: bun-deps-{{ checksum "bun.lock" }}
      - persist_to_workspace:
          root: ~/project
          paths:
            - .

  check:
    executor: bun-executor
    steps:
      - attach_workspace:
          at: ~/project
      - load-node-from-workspace
      - run:
          name: Run Check (lint | format)
          command: bun run check

  validate-recipes:
    executor: bun-executor
    steps:
      - attach_workspace:
          at: ~/project
      - load-node-from-workspace
      - run:
          name: Validate Recipes
          command: bun run validate

  test:
    executor: bun-executor
    steps:
      - attach_workspace:
          at: ~/project
      - load-node-from-workspace
      - run:
          name: Run Tests
          command: bun test

  build:
    executor: bun-executor
    steps:
      - attach_workspace:
          at: ~/project
      - run:
          name: Build Site
          command: bun run build
      - persist_to_workspace:
          root: ~/project
          paths:
            - build

  deploy:
    executor: bun-executor
    steps:
      - attach_workspace:
          at: ~/project
      - load-node-from-workspace
      - run:
          name: Install rclone
          command: |
            apt-get update && apt-get install -y --no-install-recommends ca-certificates rclone git
            rclone version
      - run:
          name: Deploy to Cloudflare Pages
          command: |
            test -n "$CLOUDFLARE_API_TOKEN" || (echo "Missing CLOUDFLARE_API_TOKEN" && exit 1)
            test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo "Missing CLOUDFLARE_ACCOUNT_ID" && exit 1)
            ls -la build
            bunbun src/cloudflare/upload-imgs-to-r2.ts && bun run deploy:site

workflows:
  version: 2
  validate-and-generate:
    jobs:
      - setup
      - check:
          requires:
            - setup
      - validate-recipes:
          requires:
            - setup
      - test:
          requires:
            - setup
      - build:
          requires:
            - check
            - validate-recipes
            - test
      - deploy:
          requires:
            - build
          filters:
            branches:
              only: main
