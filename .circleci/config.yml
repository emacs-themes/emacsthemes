version: 2.1

executors:
  bun-executor:
    docker:
      - image: oven/bun:1
    working_directory: ~/project

jobs:
  setup:
    executor: bun-executor
    steps:
      - checkout
      - restore_cache:
          keys:
            - bun-deps-{{ checksum "bun.lock" }}
      - run:
          name: Install Dependencies
          command: bun ci
      - save_cache:
          paths:
            - ~/.bun
          key: bun-deps-{{ checksum "bun.lock" }}
      - persist_to_workspace:
          root: ~/project
          paths:
            - .

  lint:
    executor: bun-executor
    steps:
      - attach_workspace:
          at: ~/project
      - run:
          name: Run Linting
          command: bun run lint

  validate-recipes:
    executor: bun-executor
    steps:
      - attach_workspace:
          at: ~/project
      - run:
          name: Validate Recipes
          command: bun run validate

  test:
    executor: bun-executor
    steps:
      - attach_workspace:
          at: ~/project
      - run:
          name: Run Tests
          command: bun test

  build:
    executor: bun-executor
    steps:
      - attach_workspace:
          at: ~/project
      - run:
          name: Build Site
          command: bun run build
      - persist_to_workspace:
          root: ~/project
          paths:
            - build

  deploy:
    executor: bun-executor
    steps:
      - attach_workspace:
          at: ~/project
      - run:
          name: Install rclone
          command: |
            NODE_VERSION="22.11.0"
            apt-get update && apt-get install -y --no-install-recommends ca-certificates rclone git curl xz-utils
            curl -fsSL "https://nodejs.org/dist/v${NODE_VERSION}/node-v${NODE_VERSION}-linux-x64.tar.xz" -o /tmp/node.tar.xz
            mkdir -p /usr/local/lib/nodejs
            tar -xJf /tmp/node.tar.xz -C /usr/local/lib/nodejs
            ln -sf "/usr/local/lib/nodejs/node-v${NODE_VERSION}-linux-x64/bin/node" /usr/local/bin/node
            ln -sf "/usr/local/lib/nodejs/node-v${NODE_VERSION}-linux-x64/bin/npm" /usr/local/bin/npm
            ln -sf "/usr/local/lib/nodejs/node-v${NODE_VERSION}-linux-x64/bin/npx" /usr/local/bin/npx
            update-ca-certificates
            rclone version
            node --version
            npm --version
            npx --version
      - run:
          name: Deploy to Cloudflare Pages
          command: |
            test -n "$CLOUDFLARE_API_TOKEN" || (echo "Missing CLOUDFLARE_API_TOKEN" && exit 1)
            test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo "Missing CLOUDFLARE_ACCOUNT_ID" && exit 1)
            shopt -s expand_aliases
            alias bun='npm'
            ls -la build
            CI=true WRANGLER_SEND_METRICS=false bun run deploy

workflows:
  version: 2
  validate-and-generate:
    jobs:
      - setup
      - lint:
          requires:
            - setup
      - validate-recipes:
          requires:
            - setup
      - test:
          requires:
            - setup
      - build:
          requires:
            - lint
            - validate-recipes
            - test
      - deploy:
          requires:
            - build
          filters:
            branches:
              only: main
