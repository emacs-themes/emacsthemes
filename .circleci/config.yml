version: 2.1

executors:
  bun-executor:
    docker:
      - image: oven/bun:1

jobs:
  lint:
    executor: bun-executor
    steps:
      - checkout
      - restore_cache:
          keys:
            - bun-deps-{{ checksum "bun.lock" }}
      - run:
          name: Install Dependencies
          command: bun install
      - save_cache:
          paths:
            - node_modules
            - ~/.bun
          key: bun-deps-{{ checksum "bun.lock" }}
      - run:
          name: Run Linting
          command: bun run lint

  validate-recipes:
    executor: bun-executor
    steps:
      - checkout
      - restore_cache:
          keys:
            - bun-deps-{{ checksum "bun.lock" }}
      - run:
          name: Install Dependencies
          command: bun install
      - save_cache:
          paths:
            - node_modules
            - ~/.bun
          key: bun-deps-{{ checksum "bun.lock" }}
      - run:
          name: Validate Recipes
          command: bun run validate:pr

workflows:
  version: 2
  validate-and-generate:
    jobs:
      - lint
      - validate-recipes:
          requires:
            - lint
