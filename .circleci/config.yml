version: 2.1

executors:
  bun-executor:
    docker:
      - image: oven/bun:1
    working_directory: ~/project

jobs:
  setup:
    executor: bun-executor
    steps:
      - checkout
      - restore_cache:
          keys:
            - bun-deps-{{ checksum "bun.lock" }}
      - run:
          name: Install Dependencies
          command: bun ci
      - save_cache:
          paths:
            - ~/.bun
          key: bun-deps-{{ checksum "bun.lock" }}
      - persist_to_workspace:
          root: ~/project
          paths:
            - .

  lint:
    executor: bun-executor
    steps:
      - attach_workspace:
          at: ~/project
      - run:
          name: Run Linting
          command: bun run lint

  validate-recipes:
    executor: bun-executor
    steps:
      - attach_workspace:
          at: ~/project
      - run:
          name: Validate Recipes
          command: bun run validate

  test:
    executor: bun-executor
    steps:
      - attach_workspace:
          at: ~/project
      - run:
          name: Run Tests
          command: bun test

  build:
    executor: bun-executor
    steps:
      - attach_workspace:
          at: ~/project
      - run:
          name: Build Site
          command: bun run build
      - persist_to_workspace:
          root: ~/project
          paths:
            - build

  deploy:
    executor: bun-executor
    steps:
      - attach_workspace:
          at: ~/project
      - run:
          name: Install rclone
          command: |
            apt-get update && apt-get install -y curl
            curl https://rclone.org/install.sh | bash
      - run:
          name: Deploy to Cloudflare Pages
          command: bun run deploy

workflows:
  version: 2
  validate-and-generate:
    jobs:
      - setup
      - lint:
          requires:
            - setup
      - validate-recipes:
          requires:
            - setup
      - test:
          requires:
            - setup
      - build:
          requires:
            - lint
            - validate-recipes
            - test
      - deploy:
          requires:
            - build
          filters:
            branches:
              only: main
