<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <title>Emacs Themes</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    {{CSS_INJECTION}}
  </head>

  <body>
    <header>
      <div class="header-container">
        <div class="brand">
          <a href="/" aria-label="Go to homepage">
            <svg aria-hidden="true" width="100" height="100" viewBox="0 0 128 128" fill="none" xmlns="http://www.w3.org/2000/svg">
              <desc>Abstract 'E' formed by a purple backbone and colored theme bars.</desc>a
              <rect x="16" y="16" width="24" height="96" rx="12" fill="#7F5AB6"/>
              <rect x="44" y="16" width="68" height="24" rx="12" fill="#D19A66"/>
              <rect x="44" y="52" width="48" height="24" rx="12" fill="#56B6C2"/>
              <rect x="44" y="88" width="68" height="24" rx="12" fill="#C678DD"/>
            </svg>
          </a>
          <h1 class="title">Emacs Themes</h1>
        </div>
      </div>
      <nav class="header-container" aria-label="Main Navigation">
        <ul class="menu">
          <li><a href="./themes">All Themes</a></li>
          <li><a href="./top-themes">Top Themes</a></li>
          <li><a href="./about">About</a></li>
        </ul>
      </nav>
    </header>

    <main id="themes">
      <form class="searchbar" role="search" aria-label="Search themes">
        <label for="q">Search</label>
        <input id="q" name="q" type="search" placeholder="Try: nord, gruvbox, light…" />
        <button type="submit">Search</button>
        <p class="sr-only" id="search-hint">Type a theme name or keyword and press Enter.</p>
      </form>

      <section class="grid" aria-label="Theme list">
        {{THEMES_GRID}}
      </section>
    </main>

    <footer>
      <div>© 2026 — <a href="/">emacsthemes.org</a> an Emacs Themes Directory</div>
    </footer>
  </body>
</html>
