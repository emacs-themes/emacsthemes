<article class="card" data-id="{{THEME_ID}}" data-name="{{THEME_NAME}}">
  <a href="/themes/{{THEME_LOCAL_URL}}.html" aria-hidden="true" tabindex="-1">
    <img src="{{THEME_IMAGE_PATH}}" alt="Preview of {{THEME_NAME}} theme" loading="lazy" />
  </a>
  <div class="content">
    <h2>{{THEME_NAME}}</h2>
    <p>{{THEME_DESCRIPTION}}</p>
    <a href="/themes/{{THEME_LOCAL_URL}}.html" aria-label="View {{THEME_NAME}} theme details"
      >View details</a
    >
  </div>
</article>
