<section class="popular">
  <div class="detail-header">
    <h2>Popular Emacs Themes</h2>
    <p class="subhead">The most popular themes on MELPA by download count.</p>
    <p class="generation-date">List generated on: {{GENERATED_DATE}}</p>
  </div>

  <div class="popular-list">
    <table class="themes-table">
      <thead>
        <tr>
          <th>Rank</th>
          <th>Theme Name</th>
          <th class="text-right">Downloads</th>
        </tr>
      </thead>
      <tbody>
        {{THEMES_LIST}}
      </tbody>
    </table>
  </div>
</section>
