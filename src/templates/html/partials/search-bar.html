<form class="searchbar" role="search" aria-label="Search themes">
  <label for="q">Filter ({{TOTAL_THEMES}} themes)</label>
  <input id="q" name="q" type="search" placeholder="Try: dark, blue, monokai…" />
  <button type="submit">Filter</button>
  <p class="sr-only" id="search-hint">Type a theme name or keyword and press Enter.</p>
</form>
<h2 id="search-results-headline" style="display: none;" aria-live="polite"></h2>
<p id="no-results-message" style="display: none;" role="status" aria-live="polite" aria-atomic="true"></p>
