<form class="searchbar" role="search" aria-label="Search themes">
  <div class="searchbar-field searchbar-query">
    <label for="q">Filter ({{TOTAL_THEMES}} themes)</label>
    <input
      id="q"
      name="q"
      type="search"
      placeholder="Try: dark, blue, monokai…"
      aria-describedby="search-hint"
    />
  </div>
  <div class="searchbar-field">
    <label for="sort">Sort by</label>
    <select id="sort" name="sort">
      <option value="name-asc" data-key="name" data-dir="asc">Name A–Z</option>
      <option value="name-desc" data-key="name" data-dir="desc">Name Z–A</option>
      <option value="date-desc" data-key="date" data-dir="desc">Date added (newest first)</option>
      <option value="date-asc" data-key="date" data-dir="asc">Date added (oldest first)</option>
    </select>
  </div>
  <button type="submit">Filter</button>
  <p class="sr-only" id="search-hint">
    Type a theme name or keyword, choose a sort order, and press Enter. When a repository filter is
    active, a chip appears below the controls — use its clear button to remove it.
  </p>
</form>
<div id="repository-filter" class="repository-filter" hidden>
  <span class="repository-filter-label">Repository:</span>
  <span id="repository-filter-name" class="repository-filter-name"></span>
  <button id="repository-filter-clear" type="button" aria-label="Clear repository filter">
    &times;
  </button>
</div>
<h2 id="search-results-headline" aria-live="polite" aria-atomic="true"></h2>
<p id="no-results-message" role="status" aria-live="polite" aria-atomic="true"></p>
