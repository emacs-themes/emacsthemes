<section class="theme-detail">
  <div class="detail-header">
    <span class="theme-type">{{THEME_TYPE}}</span>
    <h2>{{THEME_NAME}}</h2>
    <p class="subhead">{{THEME_DESCRIPTION}}</p>
    <div class="meta">
      <a href="{{THEME_REPO_URL}}" target="_blank" rel="noopener noreferrer" class="button">View Source on GitHub</a>
      <p class="generation-date">Screenshots generated on: {{GENERATED_DATE}}</p>
    </div>
  </div>

  <div class="screenshot-grid">
    {{SCREENSHOTS}}
  </div>

  <footer class="theme-tags">
    <h3>Tags</h3>
    <div class="tags-list">
      {{THEME_TAGS}}
    </div>
  </footer>
</section>
