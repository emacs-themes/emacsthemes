<section class="theme-detail">
  <div class="detail-header">
    <span class="theme-type type-{{THEME_TYPE}}">{{THEME_TYPE}}</span>
    <h2>{{THEME_NAME}}</h2>
    <p class="subhead">{{THEME_DESCRIPTION}}</p>
    <div class="meta">
      <div class="source-links" role="group" aria-label="Theme source links">
        {{THEME_SOURCE_LINKS}}
      </div>
      <p class="generation-date">Screenshots generated on: {{GENERATED_DATE}}</p>
    </div>
  </div>

  <div class="screenshot-grid">{{SCREENSHOTS}}</div>

  <footer class="theme-tags">
    <h3>Tags</h3>
    <div class="tags-list">{{THEME_TAGS}}</div>
  </footer>
</section>
