<script>
  (function() {
    const themes = {{THEMES_DATA}};
    const searchInput = document.getElementById('q');
    const searchForm = document.querySelector('.searchbar');
    const cards = document.querySelectorAll('.card');
    const resultsHeadline = document.getElementById('search-results-headline');
    const noResultsMessage = document.getElementById('no-results-message');
    const grid = document.querySelector('.grid');

    function clearNoResultsState() {
      if (!grid || !noResultsMessage) return;
      grid.style.display = 'grid';
      noResultsMessage.style.display = 'none';
    }

    function setResultsState(query, count) {
      if (!grid || !noResultsMessage) return;

      if (count === 0) {
        grid.style.display = 'none';
        if (resultsHeadline) {
          resultsHeadline.style.display = 'none';
        }
        noResultsMessage.textContent = `No results were found for "${query}".`;
        noResultsMessage.style.display = 'block';
        return;
      }

      clearNoResultsState();
      if (!resultsHeadline) return;
      if (!query) {
        resultsHeadline.style.display = 'none';
        return;
      }
      const suffix = count === 1 ? 'result' : 'results';
      resultsHeadline.textContent = `${count} ${suffix} found for "${query}".`;
      resultsHeadline.style.display = 'block';
    }

    function filterThemes(query) {
      const q = query.toLowerCase().trim();
      let visibleCount = 0;

      if (!q) {
        cards.forEach(card => {
          card.style.display = 'flex';
        });
        setResultsState('', cards.length);
        return;
      }

      cards.forEach(card => {
        const id = card.getAttribute('data-id');
        const theme = themes.find(t => t.id === id);

        if (!theme) return;

        const matches =
          theme.name.toLowerCase().includes(q) ||
          theme.type.toLowerCase().includes(q) ||
          theme.tags.some(tag => tag.toLowerCase().includes(q));

        card.style.display = matches ? 'flex' : 'none';
        if (matches) visibleCount += 1;
      });

      setResultsState(query.trim(), visibleCount);
    }

    function handleSearch(e) {
      if (e) e.preventDefault();
      const query = searchInput.value;

      // Update URL without reload
      const url = new URL(window.location);
      if (query) {
        url.searchParams.set('q', query);
      } else {
        url.searchParams.delete('q');
      }
      window.history.pushState({}, '', url);

      filterThemes(query);
    }

    // Initial load
    const params = new URLSearchParams(window.location.search);
    const initialQuery = params.get('q');

    if (initialQuery) {
      searchInput.value = initialQuery;
      filterThemes(initialQuery);
    }

    // Event listeners
    if (searchForm) {
      searchForm.addEventListener('submit', handleSearch);
    }

    // Handle browser back/forward buttons
    window.addEventListener('popstate', () => {
      const params = new URLSearchParams(window.location.search);
      const query = params.get('q') || '';
      searchInput.value = query;
      filterThemes(query);
    });
  })();
</script>
